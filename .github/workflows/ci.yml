name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            binary: cerber
          - runner: ubuntu-22.04-arm
            binary: cerber
          - runner: windows-2022
            binary: cerber.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: true
      - name: Check embedded admin JavaScript
        run: node --check internal/admin/static/app.js
      - name: Check MITRE assessment JavaScript
        run: node --check internal/admin/static/attack.js
      - name: Check network scanner console JavaScript
        run: node --check internal/admin/static/network.js
      - name: Check agent group JavaScript
        run: node --check internal/admin/static/groups.js
      - name: Check event console JavaScript
        run: node --check internal/admin/static/events.js
      - name: Regression checks for event inspector dialogs
        run: |
          node --check internal/admin/static/chain-graph.js
          node --check internal/admin/static/dialogs.js
          node --test internal/admin/uitest/*.test.cjs
      - name: Check event lifecycle JavaScript
        run: node --check internal/admin/static/lifecycle.js
      - name: Check incident workspace JavaScript
        run: node --check internal/admin/static/incidents.js
      - name: Check managed update JavaScript and Python syntax
        run: |
          node --check internal/admin/static/patches.js
          python -c "import ast,pathlib; ast.parse(pathlib.Path('internal/patch/dnf.py').read_text())"
      - name: Check managed update PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('internal/patch/install.ps1','deploy/patch/Install-CerberPatchExecutor.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | Format-List; exit 1 }
          }
      - name: Native event sources and incremental cursors
        env:
          CERBER_NATIVE_SMOKE: '1'
        run: go test ./internal/eventcollector -run TestNativeEventRead -count=1 -v
      - run: go mod verify
      - run: go test ./...
      - name: Native Linux package inventory and cached APT candidates
        if: runner.os == 'Linux'
        env:
          CERBER_NATIVE_SMOKE: '1'
        run: |
          go test ./internal/collector/linux -run TestNativeLinuxInventory -count=1 -v
          go test ./cmd/cerber -run TestNativeLinuxAgent -count=1 -v
      - name: Native Windows inventory and agent delivery
        if: runner.os == 'Windows'
        env:
          CERBER_NATIVE_SMOKE: '1'
        run: go test ./cmd/cerber -run TestNativeWindowsAgent -count=1 -v
      - run: go vet ./...
      - name: Race detection
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o bin/${{ matrix.binary }} ./cmd/cerber
      - name: CLI smoke test
        run: ./bin/${{ matrix.binary }} -db smoke.db asset add -ip 127.0.0.1 -name smoke
      - name: systemd lifecycle and durable queue
        if: runner.os == 'Linux'
        run: |
          go test -c -o bin/cerber-service.test ./cmd/cerber
          cd cmd/cerber
          sudo env CERBER_SERVICE_SMOKE=1 CERBER_SERVICE_BINARY="$GITHUB_WORKSPACE/bin/cerber" "$GITHUB_WORKSPACE/bin/cerber-service.test" -test.run '^TestSystemd(ServiceLifecycle|PrivilegedInstaller)$' -test.v -test.timeout 180s
      - name: Windows SCM lifecycle and durable queue
        if: runner.os == 'Windows'
        env:
          CERBER_SERVICE_SMOKE: '1'
          CERBER_SERVICE_BINARY: ${{ github.workspace }}\bin\cerber.exe
        run: go test ./cmd/cerber -run '^TestWindowsServiceLifecycle$' -count=1 -v -timeout 180s

  vulnerabilities:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
